name: Build Peperouny Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true
      - name: Resolve Go modules
        run: go mod tidy
      - name: Build WebAssembly engine
        run: |
          set -euxo pipefail
          mkdir -p dist
          GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o dist/peperouny.wasm ./cmd/wasm
          WASM_EXEC="$(go env GOROOT)/lib/wasm/wasm_exec.js"
          test -f "$WASM_EXEC"
          cp "$WASM_EXEC" dist/wasm_exec.js
          cp web/index.html dist/index.html
          test -s dist/peperouny.wasm
          test -s dist/wasm_exec.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
